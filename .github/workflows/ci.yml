name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

jobs:
  # ── Crypto package: typecheck + tests ───────────────────────────────────────
  crypto:
    name: Crypto — typecheck + tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/crypto
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Run tests
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crypto-coverage
          path: packages/crypto/coverage/

  # ── Cloud Functions: typecheck + tests ──────────────────────────────────────
  functions:
    name: Functions — typecheck + tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Install all workspace deps from the root lockfile (functions is a workspace)
      - name: Install all workspace dependencies
        run: npm ci

      - name: Typecheck
        working-directory: functions
        run: npx tsc --noEmit

      - name: Run tests
        working-directory: functions
        run: npm run test:ci

      - name: Upload coverage
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: functions-coverage
          path: functions/coverage/

  # ── Mobile app: typecheck ────────────────────────────────────────────────────
  mobile:
    name: Mobile — typecheck
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Typecheck mobile
        run: npx tsc --noEmit
